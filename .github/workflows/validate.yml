name: 선수 육성 진행 검증
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: 완주 검사와 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 개발 패키지 설치
        run: npm ci
      - name: 전체 자동 검사
        run: npm test
      - name: 배포용 빌드
        run: npm run build
